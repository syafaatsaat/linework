<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Linework</title>
    <meta name="description" content="Build an ATS-friendly CV in your browser, see a live A4 preview, and export it as a text-based PDF or Word file. Free, no sign-up, and your data stays on your device." />
    <!-- Link previews (Open Graph / Twitter). The image is public/og-image.png. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://linework-delta.vercel.app/" />
    <meta property="og:title" content="Linework: ATS-friendly CV builder" />
    <meta property="og:description" content="Build a CV with a live A4 preview and export a text-based PDF or Word file that applicant tracking systems can read." />
    <meta property="og:image" content="https://linework-delta.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Linework editor beside a live A4 preview of a CV" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply a saved theme before first paint so dark mode doesn't flash light.
      try {
        const theme = JSON.parse(localStorage.getItem('linework:theme'))
        if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
